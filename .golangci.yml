# golangci-lint configuration for fastenv.
#
# Run locally: golangci-lint run ./...
# CI runs this same config via the lint step in .github/workflows/ci.yml.
run:
  timeout: 5m
  go: "1.22"

linters:
  enable:
    - errcheck      # check that errors are handled
    - gosimple      # simplify code
    - govet         # report suspicious constructs
    - ineffassign   # detect ineffectual assignments
    - staticcheck   # various static analysis checks
    - unused        # check for unused code
    - gofmt         # enforce gofmt formatting
    - goimports     # enforce import grouping and formatting
    - misspell      # spell check
    - revive        # drop-in replacement for golint

linters-settings:
  revive:
    rules:
      - name: exported
        severity: warning
  goimports:
    local-prefixes: github.com/superfield-ai/fastenv

issues:
  exclude-rules:
    # Test files may use unexported identifiers freely.
    - path: "_test\\.go"
      linters:
        - revive
        - unused
