[package]
name = "fastenv"
version = "0.1.0"
edition = "2021"
description = "OCI-native copy-on-write workspace forking for AI agent orchestration"
repository = "https://github.com/superfield-ai/fastenv"

[[bin]]
name = "fastenv"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
rustix = { version = "1", features = ["fs", "mount"] }
linux-raw-sys = { version = "0.12", features = ["general", "ioctl"] }
tempfile = "3"
thiserror = "1"
tar = "0.4"
flate2 = "1"
sha2 = "0.10"
hex = "0.4"
chrono = { version = "0.4", features = ["serde"] }
