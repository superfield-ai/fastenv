[package]
name = "fastenv"
version = "0.1.0"
edition = "2021"
description = "OCI-native copy-on-write workspace forking for AI agent orchestration"
repository = "https://github.com/superfield-ai/fastenv"

[[bin]]
name = "fastenv"
path = "src/main.rs"

# Library target exposes modules for benchmarks and integration tests.
[lib]
name = "fastenv"
path = "src/lib.rs"

# Benchmark binaries — require criterion.
# Run with: cargo bench --features youki
[[bench]]
name = "container_runtime"
harness = false

[[bench]]
name = "fork_latency"
harness = false

# e2e_runtime is replaced by fork_latency (issue #121); file is a tombstone.
[[bench]]
name = "e2e_runtime"
harness = false

[features]
# Enable the experimental youki library backend for ContainerRuntime.
# Activates YoukiBackend in src/container_runtime.rs and benchmark comparisons.
# Uses libcontainer (the Rust library crate powering the youki binary) in-process.
# No youki binary is required in PATH.
# Usage: cargo build --features youki
#        cargo bench --features youki
youki = ["dep:libcontainer"]

[dependencies]
libcontainer = { version = "0.6", optional = true }
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
rustix = { version = "1", features = ["fs", "mount"] }
linux-raw-sys = { version = "0.12", features = ["general", "ioctl"] }
tempfile = "3"
thiserror = "1"
tar = "0.4"
flate2 = "1"
sha2 = "0.10"
hex = "0.4"
chrono = { version = "0.4", features = ["serde"] }
libc = "0.2"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
