# CI pipeline for fastenv.
#
# Runs on every push and pull request to main.
# Jobs:
#   rust-fmt  — cargo fmt --check
#   rust-lint — cargo clippy --deny warnings
#   rust-test — cargo test
name: CI

on:
  push:
    branches: ["main", "feat/**", "fix/**"]
  pull_request:
    branches: ["main"]

jobs:
  rust-fmt:
    name: Rust fmt
    # fmt only needs rustfmt; no system deps (crun, overlayfs) required.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: cargo fmt --check
        run: cargo fmt --check

  rust-lint:
    name: Rust clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install crun
        run: sudo apt-get install -y crun

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: cargo clippy
        run: cargo clippy -- -D warnings

  rust-test:
    name: Rust test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install crun
        run: sudo apt-get install -y crun

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: cargo test
        run: cargo test
