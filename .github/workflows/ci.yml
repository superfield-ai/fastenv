# CI pipeline for fastenv.
#
# Runs on every push and pull request to main.
# Jobs:
#   lint      — golangci-lint with the project .golangci.yml config
#   build     — go build ./... to verify compilation
#   rust-fmt  — cargo fmt --check
#   rust-lint — cargo clippy --deny warnings
#   rust-test — cargo test
#
# Integration tests that require a live containerd daemon are skipped
# gracefully when containerd is not available (via testutil.RequireContainerd).
name: CI

on:
  push:
    branches: ["main", "feat/**", "fix/**"]
  pull_request:
    branches: ["main"]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.61.0
          args: --timeout=5m

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true

      - name: Download modules
        run: go mod download

      - name: Build
        run: go build ./...

      - name: Test (unit, no containerd required)
        run: go test ./... -count=1 -timeout=60s

  rust-fmt:
    name: Rust fmt
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: cargo fmt --check
        run: cargo fmt --check

  rust-lint:
    name: Rust clippy
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v4

      - name: Install crun
        run: sudo apt-get install -y crun

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: cargo clippy
        run: cargo clippy -- -D warnings

  rust-test:
    name: Rust test
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v4

      - name: Install crun
        run: sudo apt-get install -y crun

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: cargo test
        run: cargo test
